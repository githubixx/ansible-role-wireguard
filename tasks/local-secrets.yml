---
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Secrets shared between hosts are generated once on the Ansible controller
# (run_once avoids two hosts racing to create the same file) and stored below
# "wireguard_local_directory". Existing files are never touched.

- name: Generate AmneziaWG obfuscation parameters (once)
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/wg_keystore.py"
      - awg-params
      - "{{ wireguard__local_awg_params_file }}"
  register: wireguard__register_awg_params
  changed_when: "'created' in wireguard__register_awg_params.stdout_lines"
  check_mode: false
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - ansible_play_hosts | map('extract', hostvars, 'wireguard__fact_amneziawg') | select | list | length > 0

- name: Set AmneziaWG obfuscation parameters fact
  ansible.builtin.set_fact:
    wireguard__fact_amneziawg_params: >-
      {{ lookup('ansible.builtin.file', wireguard__local_awg_params_file) | from_json
         | combine(wireguard_amneziawg_params | default({})) }}
  when: wireguard__amneziawg | bool

- name: Generate pre-shared keys for host pairs (once)
  vars:
    wireguard__psk_paths: >-
      {%- set paths = [] -%}
      {%- for pair in ansible_play_hosts | sort | combinations(2) -%}
      {%-   if hostvars[pair[0]].wireguard__fact_preshared_keys | bool or hostvars[pair[1]].wireguard__fact_preshared_keys | bool -%}
      {%-     set _ = paths.append(wireguard__local_psk_dir ~ '/' ~ (pair | join('--')) ~ '.psk') -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ paths }}
  ansible.builtin.command:
    argv: "{{ [ansible_playbook_python, role_path ~ '/files/wg_keystore.py', 'psk'] + wireguard__psk_paths }}"
  register: wireguard__register_psks
  changed_when: "'created' in wireguard__register_psks.stdout_lines"
  check_mode: false
  delegate_to: localhost
  become: false
  run_once: true
  when: wireguard__psk_paths | length > 0
