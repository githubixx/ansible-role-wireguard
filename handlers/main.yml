- name: Restart wireguard
  ansible.builtin.service:
    name: "{{ wireguard__service_name }}"
    state: "{{ item }}"
  loop:
    - stopped
    - started
  when:
    - wireguard__restart_interface
    - ansible_facts['os_family'] != 'Darwin'
    - wireguard_service_enabled == "yes"
  listen: "reconfigure wireguard"

- name: Syncconf wireguard
  ansible.builtin.shell: |
    set -o errexit
    set -o pipefail
    set -o nounset
    systemctl is-active {{ wireguard__service_name | quote }} || systemctl start {{ wireguard__service_name | quote }}
    {{ wireguard__cmd }} syncconf {{ wireguard_interface | quote }} \
      <({{ wireguard__quick_cmd }} strip {{ (wireguard_remote_directory ~ '/' ~ wireguard_conf_filename) | quote }})
    exit 0
  register: wireguard__syncconf_out
  changed_when: false
  failed_when: wireguard__syncconf_out.rc != 0
  args:
    executable: "/bin/bash"
  when:
    - not wireguard__restart_interface
    - ansible_facts['os_family'] != 'Darwin'
    - wireguard_service_enabled == "yes"
  listen: "reconfigure wireguard"

- name: Generating Netplan Configuration
  ansible.builtin.command: netplan generate
  listen: reconfigure netplan
  notify: netplan apply config
  changed_when: true
  become: true
  when:
    - wireguard_ubuntu_use_netplan

- name: Applying Netplan Configuration
  ansible.builtin.command: netplan apply
  listen: netplan apply config
  notify: restart systemd-networkd
  changed_when: true
  become: true
  when:
    - wireguard_ubuntu_use_netplan
    - wireguard_interface_restart

- name: Restart systemd-networkd
  ansible.builtin.systemd:
    name: systemd-networkd
    state: restarted
  listen: restart systemd-networkd
  become: true
  when:
    - wireguard_ubuntu_use_netplan
    - wireguard_interface_restart

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  listen: apply sysctl
  changed_when: true
